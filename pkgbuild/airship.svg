<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Airship's icon: a cloth airship with brass bands crossing an amber
       dusk, its copper gondola lit, a puff of steam behind. Warm, side-on,
       no lettering: kept clear of the Airship company's blue mark and of
       OpenStack Airship's silhouette-over-an-A. -->
  <defs>
    <radialGradient id="dusk" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#f6c47a"/>
      <stop offset="0.6" stop-color="#d9824a"/>
      <stop offset="1" stop-color="#7a3b2a"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3df"/>
      <stop offset="0.55" stop-color="#e8dcc0"/>
      <stop offset="1" stop-color="#b9a582"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d48a52"/>
      <stop offset="1" stop-color="#8a4a26"/>
    </linearGradient>
    <clipPath id="badge"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dusk)"/>
  <path d="M0 50 L18 38 L26 44 L36 32 L48 42 L64 34 L64 64 L0 64 Z" fill="#5a3324" opacity="0.55" clip-path="url(#badge)"/>
  <!-- steam, behind the gondola -->
  <circle cx="13" cy="41" r="3.2" fill="#fff6ea" opacity="0.55"/>
  <circle cx="8.5" cy="37.5" r="4.2" fill="#fff6ea" opacity="0.35"/>
  <!-- tail fins -->
  <path d="M8 22 L4 13 L13 18 Z M8 30 L4 39 L13 34 Z" fill="#c99654" stroke="#6b3f1e" stroke-width="1"/>
  <!-- the envelope -->
  <ellipse cx="32" cy="26" rx="24" ry="11" fill="url(#cloth)" stroke="#6b3f1e" stroke-width="1.4"/>
  <path d="M18 16.6 Q15.4 26 18 35.4 M26 15.3 Q23.6 26 26 36.7 M34 15.2 Q31.6 26 34 36.8 M42 16 Q39.6 26 42 36 M49.5 18.6 Q47.6 26 49.5 33.4" fill="none" stroke="#b5833c" stroke-width="1.3"/>
  <path d="M10 24.5 Q32 21 54 24.5" fill="none" stroke="#fffaf0" stroke-width="1.2" opacity="0.7"/>
  <!-- hangers and the gondola -->
  <path d="M24 36.6 L22.5 41.5 M40 36.6 L41.5 41.5" stroke="#6b3f1e" stroke-width="1.3"/>
  <rect x="19" y="41.5" width="26" height="8" rx="2.2" fill="url(#copper)" stroke="#5a2f14" stroke-width="1.2"/>
  <rect x="22.5" y="43.6" width="3" height="3" rx="0.6" fill="#ffd98a"/>
  <rect x="28" y="43.6" width="3" height="3" rx="0.6" fill="#ffd98a"/>
  <rect x="33.5" y="43.6" width="3" height="3" rx="0.6" fill="#ffd98a"/>
  <rect x="39" y="43.6" width="3" height="3" rx="0.6" fill="#ffd98a"/>
  <!-- the propeller, spinning -->
  <path d="M45 45.5 L50 45.5" stroke="#b5833c" stroke-width="1.6"/>
  <ellipse cx="51" cy="45.5" rx="1.6" ry="5.5" fill="#f3e3c4" opacity="0.55"/>
  <circle cx="51" cy="45.5" r="1.3" fill="#b5833c"/>
</svg>
